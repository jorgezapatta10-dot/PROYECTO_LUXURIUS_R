<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil | Luxurius Room</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg site-nav"><div class="container"><a class="navbar-brand" href="index.html"><span class="brand-mark">L</span> Luxurius Room</a><div class="navbar-nav"><a class="nav-link" href="index.html">Explorar</a><a class="nav-link" href="alojamientos.html">Alojamientos</a></div><div id="account-nav" class="navbar-nav ms-auto"></div></div></nav>
  <main class="container section-space profile-page">
    <p class="eyebrow">CUENTA PERSONAL</p><h1>Mi perfil</h1><p id="profile-status" class="form-status" role="status">Cargando perfil...</p>
    <div class="profile-grid">
      <section class="profile-section"><h2>Datos personales</h2><form id="profile-form" class="vstack gap-3"><div class="row g-3"><div class="col-sm-6"><label class="form-label" for="nombre">Nombre</label><input class="form-control" id="nombre" name="nombre" required></div><div class="col-sm-6"><label class="form-label" for="apellido">Apellido</label><input class="form-control" id="apellido" name="apellido" required></div></div><div><label class="form-label" for="email">Correo electronico</label><input class="form-control" id="email" name="email" type="email" readonly></div><div><label class="form-label" for="telefono">Telefono</label><input class="form-control" id="telefono" name="telefono" type="tel"></div><div class="profile-role"><span class="form-label">Tipo de cuenta</span><span id="rol"></span></div><button class="btn btn-primary align-self-start" type="submit">Guardar cambios</button></form></section>
      <section class="profile-section"><h2>Cambiar contrasena</h2><form id="password-form" class="vstack gap-3"><div><label class="form-label" for="password-actual">Contrasena actual</label><input class="form-control" id="password-actual" name="passwordActual" type="password" autocomplete="current-password" required></div><div><label class="form-label" for="password-nueva">Contrasena nueva</label><input class="form-control" id="password-nueva" name="passwordNueva" type="password" minlength="8" autocomplete="new-password" required><p class="field-hint">Minimo 8 caracteres, con letras y numeros.</p></div><button class="btn btn-outline-primary align-self-start" type="submit">Actualizar contrasena</button></form><p id="password-status" class="form-status" role="status"></p></section>
    </div>
  </main>
  <footer class="site-footer"><div class="container d-flex justify-content-between gap-2"><span>Luxurius Room</span><span>El pago se realiza en el alojamiento.</span></div></footer>
  <script src="js/app.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>

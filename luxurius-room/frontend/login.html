<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar | Luxurius Room</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg site-nav"><div class="container"><a class="navbar-brand" href="index.html"><span class="brand-mark">L</span> Luxurius Room</a><div class="navbar-nav ms-auto"><a class="nav-link" href="index.html">Explorar</a><a class="nav-link" href="registro.html">Crear cuenta</a></div></div></nav>
  <main class="container auth-page">
    <section class="auth-panel">
      <p class="eyebrow">TU CUENTA</p>
      <h1>Bienvenido de nuevo</h1>
      <p class="muted-copy">Ingresa con el correo y la contrasena de tu cuenta.</p>
      <p id="auth-status" class="form-status" role="status"></p>
      <form id="login-form" class="vstack gap-3">
        <div><label class="form-label" for="email">Correo electronico</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required></div>
        <div><label class="form-label" for="password">Contrasena</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary w-100" type="submit">Ingresar</button>
      </form>
      <p class="auth-switch">Aun no tienes cuenta? <a href="registro.html">Registrate</a></p>
    </section>
  </main>
  <footer class="site-footer"><div class="container d-flex justify-content-between gap-2"><span>Luxurius Room</span><span>El pago se realiza en el alojamiento.</span></div></footer>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel administrador | Luxurius Room</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg site-nav"><div class="container"><a class="navbar-brand" href="index.html"><span class="brand-mark">L</span> Luxurius Room</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Abrir navegacion"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><div class="navbar-nav"><a class="nav-link" href="index.html">Explorar</a><a class="nav-link" href="alojamientos.html">Alojamientos</a></div><div id="account-nav" class="navbar-nav ms-auto"></div></div></div></nav>
  <main class="container section-space management-page" data-panel="administrador">
    <p class="eyebrow">CONTROL DE LA PLATAFORMA</p><h1>Panel administrador</h1>
    <p id="panel-status" class="form-status" role="status">Cargando datos...</p>
    <ul class="nav nav-tabs management-tabs" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#admin-stats" type="button">Estadisticas</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#admin-users" type="button">Usuarios</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#admin-properties" type="button">Alojamientos</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#admin-bookings" type="button">Reservas</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#admin-reviews" type="button">Reseñas reportadas</button></li>
    </ul>
    <div class="tab-content management-content">
      <section class="tab-pane fade show active" id="admin-stats"><h2>Resumen</h2><div id="admin-stats-grid" class="admin-metrics"></div></section>
      <section class="tab-pane fade" id="admin-users"><h2>Usuarios</h2><div id="admin-users-list" class="management-list"></div></section>
      <section class="tab-pane fade" id="admin-properties"><h2>Alojamientos</h2><div id="admin-properties-list" class="management-list"></div></section>
      <section class="tab-pane fade" id="admin-bookings"><h2>Todas las reservas</h2><div id="admin-reservations-list" class="management-list"></div></section>
      <section class="tab-pane fade" id="admin-reviews"><h2>Reseñas reportadas</h2><div id="admin-reviews-list" class="management-list"></div></section>
    </div>
  </main>
  <footer class="site-footer"><div class="container d-flex justify-content-between gap-2"><span>Luxurius Room</span><span>Moderacion y operacion</span></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/panel.js"></script>

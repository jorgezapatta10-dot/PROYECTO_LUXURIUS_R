<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | Luxurius Room</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg site-nav"><div class="container"><a class="navbar-brand" href="index.html"><span class="brand-mark">L</span> Luxurius Room</a><div class="navbar-nav ms-auto"><a class="nav-link" href="index.html">Explorar</a><a class="nav-link" href="login.html">Ingresar</a></div></div></nav>
  <main class="container auth-page">
    <section class="auth-panel">
      <p class="eyebrow">EMPIEZA AQUI</p>
      <h1>Crea tu cuenta</h1>
      <p class="muted-copy">Elige si viajas como huesped o publicas como anfitrion.</p>
      <p id="auth-status" class="form-status" role="status"></p>
      <form id="register-form" class="vstack gap-3">
        <div class="row g-3"><div class="col-sm-6"><label class="form-label" for="nombre">Nombre</label><input class="form-control" id="nombre" name="nombre" autocomplete="given-name" required></div><div class="col-sm-6"><label class="form-label" for="apellido">Apellido</label><input class="form-control" id="apellido" name="apellido" autocomplete="family-name" required></div></div>
        <div><label class="form-label" for="email">Correo electronico</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required></div>
        <div><label class="form-label" for="telefono">Telefono <span class="optional-label">Opcional</span></label><input class="form-control" id="telefono" name="telefono" type="tel" autocomplete="tel"></div>
        <div><label class="form-label" for="password">Contrasena</label><input class="form-control" id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><p class="field-hint">Minimo 8 caracteres, con letras y numeros.</p></div>
        <div><label class="form-label" for="rol">Tipo de cuenta</label><select class="form-select" id="rol" name="rol" required><option value="HUESPED">Huesped</option><option value="ANFITRION">Anfitrion</option></select></div>
        <button class="btn btn-primary w-100" type="submit">Crear cuenta</button>
      </form>
      <p class="auth-switch">Ya tienes cuenta? <a href="login.html">Ingresa</a></p>
    </section>
  </main>
  <footer class="site-footer"><div class="container d-flex justify-content-between gap-2"><span>Luxurius Room</span><span>El pago se realiza en el alojamiento.</span></div></footer>
  <script src="js/app.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis reservas | Luxurius Room</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg site-nav"><div class="container"><a class="navbar-brand" href="index.html"><span class="brand-mark">L</span> Luxurius Room</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Abrir navegacion"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><div class="navbar-nav"><a class="nav-link" href="index.html">Explorar</a><a class="nav-link" href="alojamientos.html">Alojamientos</a></div><div id="account-nav" class="navbar-nav ms-auto"></div></div></div></nav>
  <main class="container section-space reservations-page">
    <p class="eyebrow">TU VIAJE</p><h1>Mis reservas</h1>
    <p id="reservations-status" class="form-status" role="status">Cargando reservas...</p>
    <div id="reservations-list" class="reservation-list"></div>
    <section id="reservations-empty" class="empty-state d-none"><h2>Aun no tienes reservas</h2><p>Cuando encuentres tu proxima estancia, aparecera aqui.</p><a href="alojamientos.html" class="btn btn-primary">Explorar alojamientos</a></section>
  </main>
  <div class="modal fade" id="review-modal" tabindex="-1" aria-labelledby="review-title" aria-hidden="true"><div class="modal-dialog"><div class="modal-content"><form id="review-form"><div class="modal-header"><h2 class="modal-title fs-5" id="review-title">Calificar estancia</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div class="modal-body"><p id="review-property" class="muted-copy"></p><input type="hidden" name="codigoReserva"><div class="mb-3"><label class="form-label" for="review-rating">Calificacion</label><select id="review-rating" name="calificacion" class="form-select" required><option value="">Selecciona de 1 a 5 estrellas</option><option value="5">5 · Excelente</option><option value="4">4 · Muy buena</option><option value="3">3 · Buena</option><option value="2">2 · Regular</option><option value="1">1 · Mala</option></select></div><div><label class="form-label" for="review-comment">Comentario</label><textarea id="review-comment" name="comentario" class="form-control" maxlength="1000" rows="4"></textarea></div><p id="review-status" class="form-status" role="status"></p></div><div class="modal-footer"><button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-primary">Enviar reseña</button></div></form></div></div></div>
  <footer class="site-footer"><div class="container d-flex justify-content-between gap-2"><span>Luxurius Room</span><span>El pago se realiza en el alojamiento.</span></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/reservas.js"></script>
</body>
</html>
